name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

      - name: Install build tools, platform and NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)"
          "$SDKMANAGER" --licenses < /dev/null > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "ndk;27.3.13750724" < /dev/null

      - name: Build the JAR
        run: bash build.sh

      - name: Run the host tests
        run: bash test.sh

      - name: Build and verify every Android ABI
        run: bash scripts/test-abis.sh

      - name: Keep the JAR and the ABI test libraries
        uses: actions/upload-artifact@v4
        with:
          name: ndk-loader-${{ github.run_id }}
          path: |
            dist/ndk-loader.jar
            build/test-libs/**/*.so
          retention-days: 14
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -d "$SDK"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/emulator" >> "$GITHUB_PATH"

      - name: Install build tools, platform and NDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -1)"
          "$SDKMANAGER" --licenses < /dev/null > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "build-tools;36.0.0" \
            "platforms;android-36" \
            "ndk;27.3.13750724" < /dev/null

      - name: Build the JAR and the x86_64 test library
        run: |
          bash build.sh
          bash scripts/test-abis.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Load classes.dex and a real .so on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            adb push dist/ndk-loader.jar /data/local/tmp/
            adb push build/test-libs/x86_64/libndktest.so /data/local/tmp/
            adb shell chmod 644 /data/local/tmp/ndk-loader.jar /data/local/tmp/libndktest.so
            adb shell 'CLASSPATH=/data/local/tmp/ndk-loader.jar app_process /system/bin com.mmunki.ndkloader.Main --abi'
            adb shell 'CLASSPATH=/data/local/tmp/ndk-loader.jar app_process /system/bin com.mmunki.ndkloader.Main /data/local/tmp/libndktest.so'
